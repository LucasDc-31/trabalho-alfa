name: Deploy automatico

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Atualizar codigo e subir containers
        run: |
          cd ~/trabalho-alfa
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
