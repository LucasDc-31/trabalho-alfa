services:
  web:
    build: .
    container_name: crud_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"      # acesso externo: http://IP_DO_SERVIDOR:8080
    environment:
      DB_HOST: db
      DB_NAME: crud_php
      DB_USER: ${DB_USER:?defina DB_USER no .env}
      DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: crud_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crud_php
      MYSQL_USER: ${DB_USER:?defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?defina DB_ROOT_PASS no .env}
    volumes:
      - db_data:/var/lib/mysql                                  # dados persistentes
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro    # cria a tabela na 1ª execução
    # Sem "ports": o MySQL fica acessível só para o container web (mais seguro)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
